#文件作用：面向 Mihomo / Clash Meta 的个人重度分流订阅转换模板。
#MetaFullauto_Full：以 Aethersailor Full 模板的 INI 语法与节点筛选为基线重新构建。
#原作者与上游项目：https://github.com/Aethersailor/Custom_OpenClash_Rules
#规则仅引用上游现成集合；本仓库不托管、自建或通过 CI/CD 生成 RULESET。
#用途与排序：专用服务优先于厂商大类；微软共享下载优先国内 CDN；游戏下载先于 Steam 服务。
#需要 SubConverter-Extended v1.10.5+ 与支持 MRS、GEOSITE、OR 的 Mihomo；GEOSITE 数据应保持更新。
#各地区 url-test 支持内核自动择优、故障切换及手动健康节点锁定；无需再叠加 fallback。
#只在本地维护；任何远程同步均等待用户明确决定。

[custom]

#设置规则标志位
#规则按从上到下首次命中；本段顺序与面板中策略组的显示顺序独立。

#私网固定 DIRECT，与可手动切换的国内直连组分离；PrivateNet 覆写模块提供相同保护。
ruleset=DIRECT,[]GEOSITE,private
ruleset=DIRECT,[]GEOIP,private,no-resolve

#MMDB 模式的私网 IP 由 PrivateNet 静态覆写补齐；用户特批按上游 private 网段冻结到模块。

#AI：主分类已包含 OpenAI / Grok / Gemini / Claude / Copilot；仅补 Apple Intelligence 的实际缺项。
ruleset=🤖Ai服务,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ai-!cn.mrs,172800
ruleset=🤖Ai服务,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/apple-intelligence.mrs,172800
ruleset=🤖Ai服务,clash-classic:https://ruleset.skk.moe/Clash/non_ip/apple_intelligence.txt,172800

#测速：保留源 GEOSITE 分类，补齐自动维护的 Ookla 测速服务器及传统 speedtest 名称匹配。
ruleset=🚀 测速工具,[]GEOSITE,category-speedtest
ruleset=🚀 测速工具,clash-domain:https://ruleset.skk.moe/Clash/domainset/speedtest.txt,172800
ruleset=🚀 测速工具,clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Speedtest/Speedtest.yaml,172800

#OneDrive：优先厂商大类与 Windows Update，保留国内 sharepoint.cn 和进程/关键词补充。
ruleset=💾 OneDrive,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/onedrive.mrs,172800
ruleset=💾 OneDrive,clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/OneDrive/OneDrive.yaml,172800

#国外音乐服务优先 Apple CDN；YouTube Music 与 YouTube 共享域名，仍归国外媒体。
ruleset=🎧 国外音乐服务,[]OR,((GEOSITE,spotify),(GEOSITE,apple-music),(GEOSITE,soundcloud),(GEOSITE,bandcamp),(GEOSITE,deezer),(GEOSITE,tidal),(GEOSITE,lastfm))

#国内下载更新 CDN：Windows Update / tlu 等微软共享下载先于游戏与微软服务；不导入全球下载全集。
ruleset=📦 国内下载更新CDN,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/win-update.mrs,172800
ruleset=📦 国内下载更新CDN,clash-classic:https://ruleset.skk.moe/Clash/non_ip/microsoft_cdn.txt,172800
ruleset=📦 国内下载更新CDN,clash-domain:https://ruleset.skk.moe/Clash/domainset/apple_cdn.txt,172800
ruleset=📦 国内下载更新CDN,clash-classic:https://ruleset.skk.moe/Clash/non_ip/domestic_cdn.txt,172800
ruleset=📦 国内下载更新CDN,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/PublicDirectCDN.list,172800

#游戏下载：Steam / Epic / EA Origin / Rockstar / Blizzard / Xbox / PlayStation 等；微软共享域名已提前分流。
ruleset=🎮📦 游戏下载CDN,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-game-platforms-download.mrs,172800
ruleset=🎮📦 游戏下载CDN,clash-domain:https://ruleset.skk.moe/Clash/domainset/game-download.txt,172800
ruleset=🎮📦 游戏下载CDN,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/GameDownload.list,172800
ruleset=🎮📦 游戏下载CDN,clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Game/GameDownloadCN/GameDownloadCN.yaml,172800
ruleset=🎮📦 游戏下载CDN,[]OR,((DOMAIN,st.dl.pinyuncloud.com),(DOMAIN,dl.steam.ksyna.com))

#上面两个 Steam 下载别名分别见 Meta steam@cn 与 ACL SteamCN；直接写 INI 例外，不新增 RULESET 文件。

#Netflix 独立分流；测速规则在前，因此 fast.com 等测速服务仍归测速工具。
ruleset=🎥 Netflix,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/netflix.mrs,172800

#社交媒体：大类已含 Facebook / X / Instagram；TikTok 独立补入，其余来源仅选有实际增量的集合。
ruleset=🌐 社交媒体,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-social-media-!cn.mrs,172800
ruleset=🌐 社交媒体,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/tiktok.mrs,172800
ruleset=🌐 社交媒体,clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Facebook/Facebook.yaml,172800
ruleset=🌐 社交媒体,clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Twitter/Twitter.yaml,172800
ruleset=🌐 社交媒体,clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Instagram/Instagram.yaml,172800

#国外媒体合并 YouTube / AppleTV+ / DisneyPlus / HBO / PrimeVideo / Bahamut，以及用户指定的 Telegram / Discord。
ruleset=📹 国外媒体,[]OR,((GEOSITE,youtube),(GEOSITE,apple-tvplus),(GEOSITE,disney),(GEOSITE,hbo),(GEOSITE,primevideo),(GEOSITE,bahamut),(GEOSITE,telegram),(GEOSITE,discord))

#本次核查的上游集合没有可按域名可靠区分的 YouTube Shorts 单独集；Shorts 跟随整个 YouTube。

#Steam 其余非下载服务：社区、聊天、商店、账号和 Web API；全部已识别的下载在本条之前分流。
ruleset=🎮 Steam社区|网络|Chat,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/steam.mrs,172800

#厂商服务：AI / YouTube / 音乐 / OneDrive / 更新 CDN 已优先分离。Google 集包含 Play、GMS、FCM。
ruleset=🇬 谷歌服务,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/google.mrs,172800

#国内游戏、国内开发源保留直连；国外开发工具、容器、代码托管和软件镜像独立控制。
ruleset=🇨🇳 本地|国内直连,[]GEOSITE,category-games@cn
ruleset=🇨🇳 本地|国内直连,[]GEOSITE,category-dev@cn
ruleset=🚀 GitHub及开发者服务,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-dev.mrs,172800
ruleset=🚀 GitHub及开发者服务,clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Developer/Developer.yaml,172800
ruleset=🚀 GitHub及开发者服务,clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Docker/Docker.yaml,172800
ruleset=🚀 GitHub及开发者服务,clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/GitHub/GitHub.yaml,172800

#暂不引用通用 download 全集，避免把对象存储与网盘误归为开发者服务。

#Microsoft 大类也包含 GitHub 等旗下服务，所以放在开发者组之后；Store 与其余微软服务归本组。
ruleset=Ⓜ️ 微软服务,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/microsoft.mrs,172800

#境外购物、支付与加密货币；补 PayPal / Stripe / Wise / Visa / Mastercard，避免把全部银行域名当电商。
ruleset=🇨🇳 本地|国内直连,[]GEOSITE,category-ecommerce@cn
ruleset=🪙 支付服务及加密币,[]OR,((GEOSITE,category-ecommerce),(GEOSITE,category-cryptocurrency),(GEOSITE,amazon),(GEOSITE,paypal),(GEOSITE,stripe),(GEOSITE,wise),(GEOSITE,visa),(GEOSITE,mastercard))

#直连补充仅选可解释的增量，避免叠加一整份与 cn 高度重复的 ChinaMax。
ruleset=🇨🇳 本地|国内直连,clash-domain:https://cdn.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Domain.mrs,172800
ruleset=🇨🇳 本地|国内直连,clash-classic:https://ruleset.skk.moe/Clash/non_ip/domestic.txt,172800
ruleset=🇨🇳 本地|国内直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list,172800

#原项目的代理补充与 GFW 保留；具名服务已在上方匹配。
ruleset=🚀 手动选择,clash-domain:https://cdn.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Domain.mrs,172800
ruleset=🚀 手动选择,[]GEOSITE,gfw
ruleset=🇨🇳 本地|国内直连,[]GEOSITE,cn

#IP 补充放在域名分类之后；不用会掩盖社区/游戏下载边界的 Steam_CDN 混合集。
ruleset=📹 国外媒体,[]GEOIP,telegram,no-resolve
ruleset=🌐 社交媒体,[]GEOIP,twitter,no-resolve
ruleset=🌐 社交媒体,[]GEOIP,facebook,no-resolve
ruleset=🇬 谷歌服务,[]GEOIP,google,no-resolve
ruleset=🎥 Netflix,[]GEOIP,netflix,no-resolve
ruleset=🇨🇳 本地|国内直连,clash-classic:https://cdn.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Classical_IP.yaml,172800
ruleset=🚀 手动选择,clash-classic:https://cdn.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Classical_IP.yaml,172800
ruleset=🇨🇳 本地|国内直连,[]GEOIP,cn,no-resolve

#已识别国内流量直连，其余默认代理；geolocation-!cn 与最终兜底都进入漏网之鱼。
ruleset=🐟 漏网之鱼,[]GEOSITE,geolocation-!cn
ruleset=🐟 漏网之鱼,[]FINAL

